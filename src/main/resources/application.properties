spring.config.import=optional:file:./application-local.properties

# ============================================
# MySQL Database Connection
# Credentials belong in the Git-ignored application-local.properties.
# ============================================
spring.datasource.url=jdbc:mysql://localhost:3306/student_management_db?useSSL=false&serverTimezone=UTC&createDatabaseIfNotExist=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ============================================
# JPA / Hibernate
# ddl-auto=update -> Hibernate will create/update
# the "users" and "students" tables automatically
# based on the entity classes.
# ============================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ============================================
# Server
# ============================================
server.port=8080

# ============================================
# Session
# ============================================
server.servlet.session.timeout=30m
